<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinLedger GitHub Pages</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; line-height: 1.5; }
    .card { max-width: 760px; margin: auto; padding: 1.5rem; border: 1px solid #ddd; border-radius: 12px; }
    .status { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>FinLedger GitHub Pages</h1>
    <p>This page is published by GitHub Pages. Its content is generated by a GitHub Actions workflow, which can read the repository secret safely.</p>
    <div id="status" class="status">Loading workflow data…</div>
  </div>

  <script>
    async function loadStatus() {
      const statusEl = document.getElementById('status');
      try {
        const response = await fetch('./site-data.json');
        if (!response.ok) throw new Error('site-data.json not found');
        const data = await response.json();
        statusEl.innerHTML = `<strong>${data.message}</strong><br/><br/>Workflow secret available: ${data.secretAvailableToWorkflow}`;
      } catch (error) {
        statusEl.textContent = 'Unable to load workflow-generated data: ' + error.message;
      }
    }

    loadStatus();
  </script>
</body>
</html>
